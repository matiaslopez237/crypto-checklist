name: Telegram Commands

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (UTC) — lets phone commands update your position quickly
  workflow_dispatch: {} # lets you trigger a manual run from the Actions tab, for testing

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Process pending Telegram commands
        run: node monitor/process-commands.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Persist position and offset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add monitor/positions.json monitor/telegram-offset.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: aplicar comando de Telegram"
          # The market-check workflow can push at the same time; retry on conflict.
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done
